plugins {
    id 'java'
    id 'application'
    id("com.gradleup.shadow") version "9.2.2"
    id("io.freefair.lombok") version "9.0.0"
}

group = 'cc.happyareabean'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:7.2.4'
    implementation("com.fasterxml.jackson.core:jackson-databind:2.22.4")
    implementation 'org.slf4j:slf4j-simple:2.0.20'
}

application {
    mainClass = 'cc.happyareabean.tauonsongapi.APIServer'
}

shadowJar {
    archiveClassifier.set("")
    archiveVersion.set("")
}

jar {
    manifest {
        attributes 'Main-Class': 'cc.happyareabean.tauonsongapi.APIServer'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

runShadow {
    javaLauncher = javaToolchains.launcherFor {
        vendor = JvmVendorSpec.JETBRAINS
        languageVersion = JavaLanguageVersion.of(21)
    }
    jvmArgs("-XX:+AllowEnhancedClassRedefinition")
}

tasks.named('run') {
    String workDir = System.getenv("DEV_WORK_DIR")
    if (workDir != null)
        workingDir = file(workDir.toString())
}